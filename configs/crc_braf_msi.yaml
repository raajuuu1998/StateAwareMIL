display_name: TCGA-COAD+READ
output_name: CRC_BRAF_MSI
expected_patients: 443
biomarker_a: BRAF
biomarker_b: MSI

data:
  manifest: data/crc_braf_msi/manifest.csv
  fold_file: null
  embeddings:
    uni2:
      - data/crc_braf_msi/embeddings/uni2h
    conch:
      - data/crc_braf_msi/embeddings/conch

foundation_models:
  uni2:
    display_name: UNI2-h
    dimension: 1536
  conch:
    display_name: CONCH
    dimension: 512

training:
  seed: 42
  train_tile_cap: 3000
  evaluation_tile_cap: null
  hidden_dim: 256
  attention_dim: 128
  dropout: 0.10
  lr: 1.0e-4
  weight_decay: 1.0e-5
  max_epochs: 30
  patience: 6
  gradient_accumulation: 4
  auxiliary_weight: 0.25
  validation_fraction: 0.15
  posthoc_c: 1.0
  posthoc_max_iter: 2000
